[project]
name = "equitycase_wa_backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viral Mistry", email = "viralmistry240@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
equitycase_wa_backend = "equitycase_wa_backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]


#------
# Ruff 
#------

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "T20",
]

ignore = [
    "E501",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException" = { msg = "Do not use HTTPException. Use an application error from src.errors instead." }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"