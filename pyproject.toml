[project]
name = "equitycase_wa_backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viral Mistry", email = "viralmistry240@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.97",
    "fastapi>=0.141.1",
    "firebase-admin>=7.6.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.42",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
equitycase_wa_backend = "equitycase_wa_backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]


#------
# Pytest
#------

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the app's async engine is module-global
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # third-party: slowapi still calls asyncio.iscoroutinefunction
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]


#------
# Ruff
#------

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]
# Autogenerated by Alembic, reviewed by hand
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "T20",
]

ignore = [
    "E501",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException" = { msg = "Do not use HTTPException. Use an application error from errors.exceptions instead." }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
