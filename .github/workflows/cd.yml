# CD: main only, and only after CI passed on that commit.
# Build + push the image to GHCR -> copy docker-compose.prod.yml to the server
# -> pull + up (migrations run first, the app must turn healthy).
#
# GitHub -> Settings -> Environments -> "production" -> secrets:
#   SSH_HOST         server IP / hostname
#   SSH_PORT         usually 22
#   SSH_USER         deploy user (member of the docker group)
#   SSH_PRIVATE_KEY  private key whose public key is in ~/.ssh/authorized_keys
#
# The server keeps its own .env and the Firebase JSON in /home/equitycase_wa
# (see docker-compose.prod.yml); CD never touches secrets besides APP_IMAGE.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/equitycase_wa
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build + push image
    # a CI run from a push to main that succeeded (or a manual run on main)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the exact commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          sha="$(git rev-parse HEAD)"
          echo "name=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${repo}:${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copy docker-compose.prod.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull + up
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f .env || { echo ".env missing in $DEPLOY_DIR"; exit 1; }

            # Remember the deployed image, so a plain `docker compose up` on
            # the server (reboot, manual restart) uses the same one
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
            else
              printf '\nAPP_IMAGE=%s\n' "$APP_IMAGE" >> .env
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            compose="docker compose -f docker-compose.prod.yml"
            $compose pull migrate app
            # migrate runs first; --wait fails the deploy if the app isn't healthy
            $compose up -d --remove-orphans --wait --wait-timeout 120
            docker logout ghcr.io

            # unused images older than a week (keeps recent ones for a rollback)
            docker image prune -af --filter "until=168h"
            curl -fsS http://127.0.0.1:8080/healthz
            echo
            echo "deployed $APP_IMAGE"
