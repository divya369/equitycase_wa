# wa.equitycase.com -> Equity Case WhatsApp backend (docker, one uvicorn worker)
#
# Server: /etc/nginx/conf.d/wa.equitycase.com.conf
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d wa.equitycase.com    (adds 443 + the http->https redirect)
#
# This file lives in the http{} context (conf.d / sites-enabled are included there).

upstream equitycase_wa_backend {
    # The container publishes its port on localhost only: "127.0.0.1:8080:8080"
    server 127.0.0.1:8080;
    keepalive 16;
}

# WebSocket upgrade: "upgrade" for /ws, plain keep-alive for everything else
map $http_upgrade $equitycase_wa_connection {
    default upgrade;
    ""      "";
}

# $uri, not $request: /ws carries the JWT in the query string, never log it
log_format equitycase_wa '$remote_addr - $time_local "$request_method $uri" '
                         '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name wa.equitycase.com;

    server_tokens off;
    access_log /var/log/nginx/wa.equitycase.com.access.log equitycase_wa;

    # Meta webhook bodies are small; raise when media upload (P10) lands
    client_max_body_size 10m;

    location / {
        proxy_pass http://equitycase_wa_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket handshake (/ws); empty for normal requests
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $equitycase_wa_connection;

        proxy_connect_timeout 5s;
        # the app closes an idle socket after 60s; stay above that
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
